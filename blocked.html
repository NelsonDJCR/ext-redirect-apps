<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sitio bloqueado</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --text: #1c1f24;
      --muted: #6b7280;
      --accent: #e5484d;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a;
        --card: #1e2127;
        --text: #f1f3f5;
        --muted: #9aa1ac;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      background: var(--card);
      max-width: 420px;
      width: calc(100% - 32px);
      padding: 40px 32px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }
    .icon { font-size: 48px; margin-bottom: 12px; }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { color: var(--muted); margin: 6px 0; line-height: 1.5; }
    .site { color: var(--accent); font-weight: 600; }
    .window {
      display: inline-block;
      margin-top: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: var(--bg);
      font-weight: 600;
    }
    .timer {
      margin-top: 12px;
      font-size: 34px;
      font-weight: 700;
      letter-spacing: 0.03em;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
    }
    .timer-label {
      margin-top: 2px;
      font-size: 12px;
      color: var(--muted);
    }
    .actions {
      margin-top: 14px;
      display: flex;
      justify-content: center;
    }
    .enter-btn {
      border: none;
      border-radius: 999px;
      padding: 10px 16px;
      font-weight: 600;
      font-size: 14px;
      background: var(--accent);
      color: #fff;
      cursor: pointer;
    }
    .enter-btn:hover { filter: brightness(1.05); }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" id="icon">🚫</div>
    <h1 id="title">Este sitio está bloqueado ahora</h1>
    <p>
      <span class="site" id="site">Este sitio</span>
      <span id="message-rest">no está disponible en este momento.</span>
    </p>
    <p id="schedule-text" hidden>Puedes usarlo en este horario:</p>
    <div class="window" id="window" hidden></div>
    <div class="timer" id="timer" hidden>00:00</div>
    <p class="timer-label" id="timer-label" hidden>Tiempo restante</p>
    <div class="actions">
      <button id="enter-btn" class="enter-btn" type="button" hidden>Ingresar al sitio</button>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const site = params.get("site");
    const from = params.get("from");
    const to = params.get("to");
    const reason = params.get("reason");
    const minutes = params.get("minutes");
    const host = params.get("host") || "";
    const until = Number(params.get("until") || 0);

    const iconEl = document.getElementById("icon");
    const titleEl = document.getElementById("title");
    const messageRestEl = document.getElementById("message-rest");
    const scheduleTextEl = document.getElementById("schedule-text");
    const windowEl = document.getElementById("window");
    const timerEl = document.getElementById("timer");
    const timerLabelEl = document.getElementById("timer-label");
    const enterBtnEl = document.getElementById("enter-btn");

    if (site) document.getElementById("site").textContent = site;

    function formatClock(ms) {
      const totalSeconds = Math.max(0, Math.ceil(ms / 1000));
      const minutesPart = Math.floor(totalSeconds / 60);
      const secondsPart = totalSeconds % 60;
      return String(minutesPart).padStart(2, "0") + ":" + String(secondsPart).padStart(2, "0");
    }

    function showCountdownTimer(options = {}) {
      const {
        doneLabel = "Ya puedes volver a entrar",
        showEnterButtonWhenDone = true
      } = options;

      timerEl.hidden = false;
      timerLabelEl.hidden = false;
      enterBtnEl.hidden = true;

      let endAt = until;
      if (!(endAt > Date.now())) {
        const fallbackMinutes = Number(minutes || 0);
        if (fallbackMinutes > 0) endAt = Date.now() + fallbackMinutes * 60 * 1000;
      }

      if (!(endAt > Date.now())) {
        timerEl.textContent = "00:00";
        timerLabelEl.textContent = doneLabel;
        enterBtnEl.hidden = !showEnterButtonWhenDone;
        return;
      }

      let intervalId = 0;
      const update = () => {
        const remaining = endAt - Date.now();
        if (remaining <= 0) {
          timerEl.textContent = "00:00";
          timerLabelEl.textContent = doneLabel;
          enterBtnEl.hidden = !showEnterButtonWhenDone;
          if (intervalId) clearInterval(intervalId);
          return;
        }
        timerEl.textContent = formatClock(remaining);
      };

      update();
      intervalId = setInterval(update, 250);
    }

    if (reason === "cooldown") {
      iconEl.textContent = "⏱";
      titleEl.textContent = "Bloqueado por cooldown";
      messageRestEl.textContent =
        "está en espera durante " + minutes + (minutes === "1" ? " minuto." : " minutos.");
      scheduleTextEl.textContent =
        "Después de la espera, podrás usarlo en este horario:";
      showCountdownTimer();
    } else if (reason === "pomodoro") {
      document.getElementById("site").textContent = "Todos los sitios";
      iconEl.textContent = "🍅";
      titleEl.textContent = "Modo Pomodoro activo";
      messageRestEl.textContent = "están bloqueados temporalmente para mantener el enfoque.";
      timerLabelEl.textContent = "Fin del pomodoro";
      showCountdownTimer({ doneLabel: "Pomodoro completado", showEnterButtonWhenDone: false });
    } else if (reason === "schedule") {
      iconEl.textContent = "🕒";
      titleEl.textContent = "Fuera de horario permitido";
      messageRestEl.textContent = "está bloqueado porque ahora no está dentro de tu horario permitido.";
    } else {
      iconEl.textContent = "🚫";
      titleEl.textContent = "Sitio bloqueado";
      messageRestEl.textContent = "está bloqueado por las reglas de la extensión.";
    }

    if (from && to) {
      windowEl.textContent = from + " – " + to;
      windowEl.hidden = false;
      scheduleTextEl.hidden = false;
    }

    function toEnterUrl() {
      if (host) return "https://" + host;
      if (site) return "https://" + site + ".com";
      return "https://www.google.com";
    }

    enterBtnEl.addEventListener("click", () => {
      location.href = toEnterUrl();
    });
  </script>
</body>
</html>
